; -----------------------------------------------------------------------------
; General PHP settings
; -----------------------------------------------------------------------------
upload_max_filesize=100M
post_max_size=120M
memory_limit=${PHP_MEMORY_LIMIT:-512M}
max_execution_time=300
max_input_time=300
date.timezone=Asia/Riyadh
expose_php=Off

; -----------------------------------------------------------------------------
; Error handling
; -----------------------------------------------------------------------------
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL

; -----------------------------------------------------------------------------
; OPcache settings
; -----------------------------------------------------------------------------
; Suitable for current deployment model where application source code is mounted
; from the host into the container using bind mount.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; In development / bind-mounted source code, set to 1 to check for file changes.
; In immutable production images, set to 0 for better performance.
opcache.validate_timestamps=1

; Check for file changes every 2 seconds when validate_timestamps=1.
opcache.revalidate_freq=2

opcache.save_comments=1

; -----------------------------------------------------------------------------
; Realpath cache
; -----------------------------------------------------------------------------
; Helps PHP resolve filesystem paths faster.
realpath_cache_size=4096K
realpath_cache_ttl=600