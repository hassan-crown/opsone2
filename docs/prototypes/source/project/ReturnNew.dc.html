<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل مرتجع</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="ReturnsList" hint-size="1440px,1000px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">تسجيل مرتجع</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">من طلب جاهز مسلم، بكمية لا تتجاوز المسلَّم.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="الطلب" options="{{ orders }}" default-value="o1" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="المصدر" options="{{ srcs }}" default-value="ticket"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="المنتج" options="{{ items }}" default-value="i1" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="الكمية" default-value="1" dir="ltr" required="{{ yes }}" hint="المسلَّم 2، ولا مرتجع سابق"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.TextField" label="السبب" default-value="المقبض وصل بلون مختلف عن الطلب." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">بعد التسجيل</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يصبح المرتجع «مطلوب» بانتظار قرار المخول؛ المخزون لا يتغير الآن.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>ضمن مدة الإرجاع: 7 أيام من 14.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="ReturnsList.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="ReturnsList.dc.html">تسجيل المرتجع</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, s16: 16, noop, orders: [ { value: 'o1', label: 'ORD-24519، هيفاء المطيري، سُلّم 15 أكتوبر' } ], srcs: [ { value: 'ticket', label: 'تذكرة العميل TKT-0317' }, { value: 'call', label: 'اتصال أو زيارة' } ], items: [ { value: 'i1', label: 'مقبض مخفي، أسود' } ] };
  }
}
</script>
</body>
</html>
