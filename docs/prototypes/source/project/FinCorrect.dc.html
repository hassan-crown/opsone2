<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تصحيح قبض مؤكد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1100px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="FinOrderPaid" hint-size="1440px,1700px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">تصحيح القبض <bdi dir="ltr" style="font-family: var(--font-mono);">RCV-1188</bdi>؟</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">5,000.00 ر.س، تحويل بنكي، 22 أكتوبر.</p>
    
    <x-import component-from-global-scope="OpsOne.RadioGroup" label="نوع التصحيح" options="{{ kinds }}" default-value="amount" inline="{{ yes }}"></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.TextField" label="المبلغ الصحيح" default-value="4,500.00" dir="ltr" required="{{ yes }}"></x-import>
      <div style="display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">الفرق</span><span style="min-height: 44px; display: flex; align-items: center; font-weight: 600;">-<x-import component-from-global-scope="OpsOne.Amount" value="500.00"></x-import></span></div>
    </div>
    <x-import component-from-global-scope="OpsOne.TextField" label="السبب" default-value="ظهر في كشف البنك 4,500.00 فقط؛ حولت العميلة 500.00 أقل خطأً." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">الأثر</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يبقى السند RCV-1188 كما هو، ويُضاف سند تصحيح مرتبط به.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--warning-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="triangle-alert" size="{{ s16 }}"></x-import></span><span>يعود باقٍ 500.00 على الدفعة الأولى، ويعود مانع إكمال المرحلة؛ تُبلَّغ نورة الدوسري.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>هذا تصحيح سجل وليس ردًا من البنك.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="FinOrderPaid.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="FinOrderPaid.dc.html">حفظ التصحيح</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1100}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24, noop, kinds: [ { value: 'amount', label: 'تعديل المبلغ' }, { value: 'void', label: 'إلغاء القبض' } ], proof: [ { id: 'p1', name: 'كشف-البنك-أكتوبر.pdf', size: 402118, status: 'done' } ] };
  }
}
</script>
</body>
</html>
