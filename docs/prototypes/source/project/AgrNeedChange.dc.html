<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تعديل احتياج الطلب</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="AgrEmpty" hint-size="1440px,1100px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">تعديل احتياج <bdi dir="ltr" style="font-family: var(--font-mono);">ORD-24534</bdi>؟</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">يُطلب سبب لأن المرحلة الأولى بدأت.</p>
    
    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px;"><legend style="padding: 0; margin-bottom: 4px; font-weight: 600;">الاحتياج</legend><x-import component-from-global-scope="OpsOne.Checkbox" label="يحتاج قياسًا"></x-import><x-import component-from-global-scope="OpsOne.Checkbox" label="يحتاج تصميمًا" default-checked="{{ yes }}"></x-import></fieldset>
    <x-import component-from-global-scope="OpsOne.TextField" label="السبب" default-value="أرسلت العميلة مخطط الغرفة بمقاساته من مقاول البناء، والخزانة بين جدارين ثابتين." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">ما يتغير</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--warning-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="triangle-alert" size="{{ s16 }}"></x-import></span><span>موعد زيارة القياس المقترح يُلغى ويُبلَّغ عمر المطيري.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>«القياسات النهائية» تصبح «غير مطلوب»، وتُحفظ المقاسات المرفقة مرجعًا للتصميم.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>لا عمل بدأ يُفقد، ولا تتغير مستندات أو مبالغ.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="AgrEmpty.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="AgrEmpty.dc.html">حفظ الاحتياج</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24 };
  }
}
</script>
</body>
</html>
