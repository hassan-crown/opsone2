<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسليم طلب جاهز</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="ReadyOrder" hint-size="1440px,1100px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">تسليم <bdi dir="ltr" style="font-family: var(--font-mono);">ORD-24543</bdi></h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">بالكميات المستلمة فعلًا؛ الجزئي يبقي الباقي محجوزًا.</p>
    
    <section aria-label="الكميات" style="border: 1px solid var(--stroke-weak); border-radius: 8px; margin-top: -1px;"><div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: end; padding: 8px 14px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">منظم أدراج خشب</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">المحجوز 2</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلَّم" default-value="2" dir="ltr" input-mode="numeric"></x-import></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: end; padding: 8px 14px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">مقبض مخفي، أسود</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">المحجوز 12</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلَّم" default-value="12" dir="ltr" input-mode="numeric"></x-import></div><div style="display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 12px; align-items: end; padding: 8px 14px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">مفصلة إغلاق هادئ</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">المحجوز 4</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلَّم" default-value="4" dir="ltr" input-mode="numeric"></x-import></div></section>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.TextField" label="المستلم" default-value="هيفاء المطيري" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="الطريقة" options="{{ how }}" default-value="pick"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="التاريخ والوقت" default-value="22/10/2026 12:30" dir="ltr" required="{{ yes }}"></x-import>
      <div style="grid-column: 1 / -1;"><x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}" hint="توقيع المستلم على الشاشة أو صورة سند الاستلام."></x-import></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">عند التثبيت</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يُصرف المحجوز مرة واحدة ويصبح الطلب «مسلم».</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>لا يسجل تحصيلًا؛ الدفع مسجل مسبقًا.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>الإرجاع بعد التسليم يُسجل من «المرتجعات».</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="ReadyOrder.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="ReadyOrder.dc.html">تثبيت التسليم</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, h24: 24, s16: 16, s24: 24, noop, how: [ { value: 'pick', label: 'استلام من الفرع' }, { value: 'ship', label: 'توصيل' } ], proof: [ { id: 'p1', name: 'توقيع-هيفاء.png', size: 61240, status: 'done' } ] };
  }
}
</script>
</body>
</html>
