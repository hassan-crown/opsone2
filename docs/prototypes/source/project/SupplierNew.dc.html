<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>مورد جديد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="PurchaseList" hint-size="1440px,1000px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">مورد جديد</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">يظهر في طلبات التوريد بعد الحفظ.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.TextField" label="اسم المورد" default-value="مصنع الخليج للإكسسوارات" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="الجوال" default-value="+966 55 610 2284" dir="ltr" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="البريد" default-value="orders@gulfacc.sa" dir="ltr" optional="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="مدة التوريد المعتادة" default-value="7" dir="ltr" hint="أيام"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.TextField" label="المنتجات التي يوردها" default-value="مقابض، مفصلات، منظمات أدراج" optional="{{ yes }}"></x-import>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="PurchaseList.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="PurchaseList.dc.html">حفظ المورد</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, s16: 16, noop };
  }
}
</script>
</body>
</html>
