<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إغلاق اهتمام</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="InterestsList" hint-size="1440px,1000px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" style="position: absolute; inset-block-start: 160px; inset-inline-start: 50%; transform: translateX(50%); width: 520px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--raised); border: 1px solid var(--stroke-weak); border-radius: 12px; box-shadow: var(--shadow-raised);">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
      <h2 id="d-t" style="margin: 0; font-size: 16px; line-height: 26px; font-weight: 600;">إغلاق الاهتمام <bdi dir="ltr" style="font-family: var(--font-mono);">INT-1042</bdi>؟</h2>
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" icon="x" icon-only="{{ yes }}" aria-label="إغلاق"></x-import>
    </div>
    <p id="d-d" style="margin: -8px 0 0; color: var(--text-weak);">منيرة الشمري، أبواب داخلية لثلاث غرف.</p>
    <x-import component-from-global-scope="OpsOne.SelectField" label="سبب الإغلاق" options="{{ reasons }}" default-value="price" required="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.TextField" label="التفاصيل" default-value="قارنت بعرض آخر أقل بنحو 20%." multiline="{{ yes }}" optional="{{ yes }}"></x-import>
    <p style="margin: 0; color: var(--text-weak);">يبقى في القائمة تحت «مغلق»، ويمكن إعادة متابعته لاحقًا.</p>
    <div style="display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding-top: 4px;">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="InterestsList.dc.html">إلغاء</x-import>
      <x-import component-from-global-scope="OpsOne.Button" variant="primary" href="InterestsList.dc.html">إغلاق الاهتمام</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, reasons: [ { value: 'price', label: 'السعر أعلى من المتوقع' }, { value: 'competitor', label: 'اختار جهة أخرى' }, { value: 'noreply', label: 'لا رد بعد عدة محاولات' }, { value: 'later', label: 'أجّل الفكرة' }, { value: 'dup', label: 'مكرر' }, { value: 'other', label: 'سبب آخر' } ] };
  }
}
</script>
</body>
</html>
