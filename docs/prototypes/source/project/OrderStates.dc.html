<!doctype html>

<meta charset="utf-8">
<title>رأس الطلب في حالاته</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>

<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="width: 1440px; min-height: 1300px; box-sizing: border-box; padding: 40px 48px; display: flex; flex-direction: column; gap: 20px; background: var(--fill); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <sc-for list="{{ variants }}" as="v" hint-placeholder-count="6">
    <section style="display: flex; flex-direction: column; gap: 14px; padding: 20px 24px; background: var(--surface); border: 1px solid var(--stroke-weak); border-radius: 12px;">
      <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
        <h2 style="margin: 0; font-size: 20px; line-height: 30px; font-weight: 700;"><bdi dir="ltr" style="font-family: var(--font-mono); font-weight: 600;">{{ v.ref }}</bdi> {{ v.customer }}</h2>
        <x-import component-from-global-scope="OpsOne.Badge" tone="{{ v.tone }}">{{ v.status }}</x-import>
        <sc-if value="{{ v.extra }}" hint-placeholder-val="{{ no }}"><x-import component-from-global-scope="OpsOne.Badge" tone="{{ v.extraTone }}" icon="{{ v.extraIcon }}">{{ v.extra }}</x-import></sc-if>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
        <sc-for list="{{ v.cells }}" as="c" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">{{ c.label }}</span>
            <span style="font-weight: 600; color: {{ c.color }};">{{ c.value }}</span>
            <span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">{{ c.note }}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 12px; border-top: 1px solid var(--stroke-weak);">
        <x-import component-from-global-scope="OpsOne.Button" variant="primary">{{ v.primary }}</x-import>
        <sc-if value="{{ v.secondary }}" hint-placeholder-val="{{ yes }}"><x-import component-from-global-scope="OpsOne.Button" variant="secondary">{{ v.secondary }}</x-import></sc-if>
        <sc-if value="{{ v.hint }}" hint-placeholder-val="{{ no }}"><span style="color: var(--text-weak); margin-inline-start: 8px;">{{ v.hint }}</span></sc-if>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>

</script>
