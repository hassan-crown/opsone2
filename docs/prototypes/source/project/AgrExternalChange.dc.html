<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>توثيق موافقة منيرة الشمري على CHG-0412</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1700px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="AgrOrder" hint-size="1440px,1700px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">توثيق موافقة منيرة الشمري على <bdi dir="ltr">CHG-0412</bdi></h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">جزيرة المطبخ: زيادة 1,200.00 ر.س ويومان إضافيان. الإجمالي بعد التعديل 19,650.00 ر.س.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="الطريقة" options="{{ ways }}" default-value="wa" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="التاريخ" default-value="22/10/2026" dir="ltr" required="{{ yes }}"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}" hint="لقطة الرسالة أو البريد أو الورقة الموقعة."></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">عند التوثيق</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يُطبق التعديل مرة واحدة على الاتفاق والجدول، ويُرفع تعليق تصنيع الجزيرة.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>لا خطوة اعتماد ثانية؛ الإثبات يحفظ مع المستند نفسه.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="AgrOrder.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="AgrOrder.dc.html">توثيق الموافقة</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1700}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, s16: 16, noop, ways: [ { value: 'wa', label: 'رسالة واتساب' }, { value: 'mail', label: 'بريد' }, { value: 'paper', label: 'ورقة موقعة' } ], proof: [ { id: 'p1', name: 'موافقة-منيرة.png', size: 92140, status: 'done' } ] };
  }
}
</script>
</body>
</html>
