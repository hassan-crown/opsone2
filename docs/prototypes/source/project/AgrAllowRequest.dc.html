<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طلب سماح بالمتابعة</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="OrderSupervisor" hint-size="1440px,1500px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">طلب سماح بالمتابعة</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">لمن لا يملك صلاحية السماح؛ القرار لدى المالك أو المدير.</p>
    
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="الشرط غير المحقق" options="{{ conds }}" default-value="pay" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="العمل المطلوب السماح به" options="{{ works }}" default-value="install" required="{{ yes }}"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.TextField" label="السبب" default-value="موعد التركيب مؤكد مع العميل، ويحوّل الدفعة الأخيرة بعد الاستلام كما في طلبيه السابقين." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <div><x-import component-from-global-scope="OpsOne.Button" variant="ghost" size="sm" icon="paperclip">إرفاق إثبات (اختياري)</x-import></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">بعد الإرسال</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>يصل الطلب إلى فهد العتيبي في «تحتاج قرارك».</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>لا يتغير شيء حتى القرار، والمتطلب يبقى ظاهرًا أيًا كان القرار.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="OrderSupervisor.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="OrderSupervisor.dc.html">إرسال الطلب</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24, conds: [ { value: 'pay', label: 'تحقق التحصيل: الدفعة الأخيرة' } ], works: [ { value: 'install', label: 'تركيب الخزائن، الأحد 25 أكتوبر' } ] };
  }
}
</script>
</body>
</html>
