<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>درج الإشعارات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 900px; overflow: hidden; display: flex; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">

<aside class="o1-sidebar" style="position: relative; height: auto; display: flex;">
  <div class="o1-sidebar-brand"><x-import component-from-global-scope="OpsOne.Logo" height="{{ h28 }}"></x-import></div>
  <nav class="o1-nav" aria-label="القائمة الرئيسية"><ul>
    <sc-for list="{{ nav }}" as="item" hint-placeholder-count="8">
      <li><x-import component-from-global-scope="OpsOne.NavItem" label="{{ item.label }}" icon="{{ item.icon }}" href="{{ item.href }}" active="{{ item.active }}"></x-import></li>
    </sc-for>
  </ul></nav>
</aside>

<div class="o1-shell-main" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
  <header class="o1-topbar" style="position: relative; gap: 12px;">
    <div style="width: 440px;"><x-import component-from-global-scope="OpsOne.SearchField" label="البحث العام" placeholder="رقم الطلب أو اسم العميل أو الجوال أو المستند"></x-import></div>
    <div class="o1-topbar-end">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" icon="bell" icon-only="{{ yes }}" aria-label="الإشعارات"></x-import>
      <x-import component-from-global-scope="OpsOne.Avatar" name="فهد العتيبي" size="sm"></x-import>
    </div>
  </header>
  <main class="o1-main" style="max-width: none; padding: 32px; display: flex; flex-direction: column; gap: 24px;">
    <h1 class="o1-pagehead-title">صباح الخير، فهد</h1>
    <section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px;">
      <x-import component-from-global-scope="OpsOne.StatCard" label="المستحق الآن" value="38,200.00 ر.س" hint="على 9 طلبات"></x-import>
      <x-import component-from-global-scope="OpsOne.StatCard" label="تحصيل متأخر" value="12,750.00 ر.س" hint="4 دفعات"></x-import>
      <x-import component-from-global-scope="OpsOne.StatCard" label="صافي المقبوض هذا الشهر" value="146,300.00 ر.س" hint="بعد التصحيحات"></x-import>
      <x-import component-from-global-scope="OpsOne.StatCard" label="إيصالات بانتظار التأكيد" value="2" hint="7,500.00 ر.س"></x-import>
    </section>
    <div class="o1-card" style="height: 360px;"><h2 class="o1-card-title">تحتاج قرارك</h2></div>
  </main>
</div>

<div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

<aside role="dialog" aria-modal="true" aria-labelledby="ntf-h" style="position: absolute; inset-block: 0; inset-inline-end: 0; width: 420px; display: flex; flex-direction: column; background: var(--raised); box-shadow: var(--shadow-raised); border-inline-start: 1px solid var(--stroke-weak);">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 16px 8px 24px; padding-inline: 24px 12px;">
    <h2 id="ntf-h" style="margin: 0; font-size: 16px; line-height: 26px; font-weight: 600;">الإشعارات</h2>
    <x-import component-from-global-scope="OpsOne.Button" variant="ghost" icon="x" icon-only="{{ yes }}" aria-label="إغلاق الإشعارات"></x-import>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 16px 0 24px; padding-inline: 24px 16px; border-bottom: 1px solid var(--stroke-weak);">
    <div role="tablist" aria-label="تصفية الإشعارات" class="o1-tablist" style="border-bottom: 0;">
      <button type="button" role="tab" aria-selected="false" class="o1-tab" style="position: relative; min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; color: var(--text-weak); cursor: pointer;">الكل</button>
      <button type="button" role="tab" aria-selected="true" class="o1-tab" style="position: relative; min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">غير المقروءة <x-import component-from-global-scope="OpsOne.Counter" value="5"></x-import></button>
    </div>
    <x-import component-from-global-scope="OpsOne.Button" variant="ghost" size="sm" icon="check">تعيين الكل كمقروء</x-import>
  </div>
  <div style="flex: 1; overflow: hidden;">
    <p style="margin: 0; padding: 12px 24px 4px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--text-weak);">اليوم</p>
    <ul style="list-style: none; margin: 0; padding: 0;">
      <sc-for list="{{ today }}" as="n" hint-placeholder-count="5">
        <li style="display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; padding: 12px 24px; border-top: 1px solid var(--stroke-weak);">
          <span style="margin-top: 8px; width: 8px; height: 8px; border-radius: 9999px; background: {{ n.dot }};" role="img" aria-label="{{ n.readLabel }}"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-weight: {{ n.weight }};">{{ n.title }}</span>
            <span style="color: var(--text-weak);">{{ n.detail }}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
              <span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">{{ n.time }}</span>
              <a href="{{ n.href }}" style="min-height: 36px; display: inline-flex; align-items: center; font-weight: 500;">{{ n.link }}</a>
            </div>
          </div>
        </li>
      </sc-for>
    </ul>
    <p style="margin: 0; padding: 12px 24px 4px; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--text-weak); border-top: 1px solid var(--stroke-weak);">أمس</p>
    <ul style="list-style: none; margin: 0; padding: 0;">
      <li style="display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; padding: 12px 24px; border-top: 1px solid var(--stroke-weak);">
        <span></span>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span>تعذّر إرسال بريد التذكير للعميل</span>
          <span style="color: var(--text-weak);">ORD-24480 عبدالرحمن الفيفي. يعاد الإرسال تلقائيًا، والمستحق لم يتغير.</span>
          <span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">أمس 18:40</span>
        </div>
      </li>
    </ul>
  </div>
  <div style="padding: 12px 24px; border-top: 1px solid var(--stroke-weak);">
    <a href="#" style="min-height: 44px; display: inline-flex; align-items: center; font-weight: 500;">تفضيلات الإشعارات</a>
  </div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const unread = { dot: 'var(--highlight)', weight: 600, readLabel: 'غير مقروء' };
    return {
      yes: true, h28: 28,
      nav: [
        { label: 'الرئيسية', icon: 'layout-dashboard', href: 'Main.dc.html', active: true },
        { label: 'الطلبات', icon: 'clipboard-list', href: 'OrdersList.dc.html', active: false },
        { label: 'العملاء', icon: 'users', href: 'CustomersList.dc.html', active: false },
        { label: 'المهام والمواعيد', icon: 'calendar', href: '#', active: false },
        { label: 'المالية', icon: 'receipt', href: '#', active: false },
        { label: 'المخزون والتوريد', icon: 'package', href: '#', active: false },
        { label: 'الموقع', icon: 'file-text', href: '#', active: false },
        { label: 'التقارير', icon: 'trending-up', href: '#', active: false }
      ],
      today: [
        { ...unread, title: 'إيصال تحويل ينتظر مراجعتك منذ يومين', detail: 'ORD-24518 منيرة الشمري، 5,000.00 ر.س', time: 'قبل ساعة', link: 'مراجعة الإيصال', href: 'OrderOverview.dc.html' },
        { ...unread, title: 'طلب سماح بالمتابعة', detail: 'ORD-24490 من ماجد الحربي: بدء التركيب قبل الدفعة الأخيرة', time: 'قبل 3 ساعات', link: 'فتح الطلب', href: 'OrderOverview.dc.html' },
        { ...unread, title: 'طلب تجاوز حد الخصم', detail: 'ORD-24521 من نورة الدوسري: خصم 12%', time: 'قبل 3 ساعات', link: 'فتح الطلب', href: 'OrderOverview.dc.html' },
        { ...unread, title: 'مهمة بلا منفذ مؤهل', detail: 'ORD-24533 زيارة قياس في فرع الملقا', time: 'قبل 4 ساعات', link: 'فتح المهمة', href: 'OrderStages.dc.html' },
        { ...unread, title: 'أكد العميل موعد القياس', detail: 'ORD-24530 اليوم 10:00، حي النرجس', time: 'قبل 5 ساعات', link: 'فتح الموعد', href: '#' }
      ]
    };
  }
}
</script>
</body>
</html>
