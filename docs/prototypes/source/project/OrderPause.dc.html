<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إيقاف الطلب</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="OrderOverview" hint-size="1440px,1700px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="p-t" aria-describedby="p-d" style="position: absolute; inset-block-start: 120px; inset-inline-start: 50%; transform: translateX(50%); width: 560px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: var(--raised); border: 1px solid var(--stroke-weak); border-radius: 12px; box-shadow: var(--shadow-raised);">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
      <h2 id="p-t" style="margin: 0; font-size: 16px; line-height: 26px; font-weight: 600;">إيقاف الطلب <bdi dir="ltr" style="font-family: var(--font-mono);">ORD-24518</bdi>؟</h2>
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" icon="x" icon-only="{{ yes }}" aria-label="إغلاق"></x-import>
    </div>
    <p id="p-d" style="margin: -8px 0 0; color: var(--text-weak);">تتوقف الأعمال الجديدة حتى الاستئناف، وتحفظ المرحلة والنتائج والمواعيد كما هي.</p>

    <x-import component-from-global-scope="OpsOne.SelectField" label="سبب الإيقاف" options="{{ reasons }}" default-value="customer" required="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.TextField" label="التفاصيل" multiline="{{ yes }}" optional="{{ yes }}" default-value="طلبت العميلة تأجيل التنفيذ أسبوعين لسفرها."></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="مسؤول المتابعة" options="{{ owners }}" default-value="noura" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="موعد المراجعة" default-value="05/11/2026" dir="ltr" optional="{{ yes }}" hint="يصل تذكير للمسؤول في هذا اليوم"></x-import>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">أثر الإيقاف</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span>تبقى مراجعة الإيصال وتسجيل الدفعات متاحين أثناء الإيقاف.</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span>لا تُلغى المهام المنجزة، ولا تعاد المواعيد من الصفر عند الاستئناف.</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span>لا مواعيد مؤكدة على هذا الطلب الآن.</span>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px;">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="OrderOverview.dc.html">إلغاء</x-import>
      <x-import component-from-global-scope="OpsOne.Button" variant="primary" href="OrderStates.dc.html">إيقاف الطلب</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, s16: 16,
      reasons: [ { value: 'customer', label: 'طلب العميل' }, { value: 'material', label: 'بانتظار توفر خامة' }, { value: 'site', label: 'الموقع غير جاهز' }, { value: 'other', label: 'سبب آخر' } ],
      owners: [ { value: 'noura', label: 'نورة الدوسري' }, { value: 'sara', label: 'سارة القحطاني' }, { value: 'fahad', label: 'فهد العتيبي' } ]
    };
  }
}
</script>
</body>
</html>
