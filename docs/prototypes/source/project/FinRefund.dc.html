<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>طلب استرداد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="FinSettle" hint-size="1440px,1700px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog o1-dialog--lg" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">طلب استرداد لـ <bdi dir="ltr" style="font-family: var(--font-mono);">ORD-24461</bdi></h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">ريم السبيعي. زيادة غير مخصصة بعد تعديل الاتفاق.</p>
    
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--stroke-weak); border: 1px solid var(--stroke-weak); border-radius: 8px; overflow: hidden;"><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">القابل للرد</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="1,000.00"></x-import></span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">ردود معلقة</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="0.00"></x-import></span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">ردود منفذة</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="0.00"></x-import></span></div></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="الدفعة الأصلية" options="{{ pays }}" default-value="rcv1150" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="المبلغ" default-value="1,000.00" dir="ltr" required="{{ yes }}" hint="حتى 1,000.00"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="طريقة الرد" options="{{ rmethods }}" default-value="transfer" required="{{ yes }}"></x-import><div></div>
    </div>
    <x-import component-from-global-scope="OpsOne.TextField" label="السبب" default-value="خُفض الاتفاق بعد حذف خزانة المدخل، التعديل CHG-0398." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">بعد الطلب</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>لا ينقص المقبوض الآن؛ ينقص عند تأكيد التنفيذ بإثبات.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يُحجز المبلغ من القابل للرد، فلا يُطلب مرتين.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>لا يغير العمولة؛ الزيادة غير المخصصة لم تُحتسب لها عمولة.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="FinSettle.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="FinSettle.dc.html">طلب الاسترداد</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24, pays: [ { value: 'rcv1150', label: 'RCV-1150، تحويل بنكي 9,000.00' }, { value: 'rcv1102', label: 'RCV-1102، نقدًا 10,000.00' } ], rmethods: [ { value: 'transfer', label: 'تحويل لحساب العميلة' }, { value: 'cash', label: 'نقدًا' } ], execs: [ { value: 'hind', label: 'هند العنزي' }, { value: 'fahad', label: 'فهد العتيبي' } ] };
  }
}
</script>
</body>
</html>
