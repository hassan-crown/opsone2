<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بانتظار حاجة</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="TaskPage" hint-size="1440px,1300px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">وضع المهمة بانتظار حاجة؟</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">تركيب الخزائن، ORD-24476.</p>
    
    <x-import component-from-global-scope="OpsOne.SelectField" label="ما الذي تنتظره" options="{{ needs }}" default-value="part" required="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.TextField" label="التفاصيل" default-value="الرف الثاني تالف من النقل، ويلزم رف بديل من التصنيع." multiline="{{ yes }}" required="{{ yes }}"></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="من يحسمها" options="{{ owners }}" default-value="majed" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="موعد المتابعة" default-value="26/10/2026" dir="ltr" required="{{ yes }}"></x-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">الأثر</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يبقى ما أنجزته محفوظًا، وتعود المهمة «قيد التنفيذ» عند حسم الحاجة.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>يصل إشعار لماجد الحربي، وتظهر المهمة في تعطلات الطلب.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="TaskPage.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="TaskPage.dc.html">حفظ</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, h24: 24, s16: 16, s24: 24, needs: [ { value: 'part', label: 'قطعة أو مادة' }, { value: 'site', label: 'جاهزية الموقع' }, { value: 'customer', label: 'رد العميل' }, { value: 'other', label: 'أخرى' } ], owners: [ { value: 'majed', label: 'ماجد الحربي، مشرف القسم' }, { value: 'khalid', label: 'خالد الزهراني، مسؤول الطلب' } ] };
  }
}
</script>
</body>
</html>
