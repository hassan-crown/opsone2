<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>نقل مخزون</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="StockList" hint-size="1440px,1000px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">نقل مخزون بين المواقع</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="المنتج" options="{{ prods }}" default-value="blk" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="الكمية" default-value="10" dir="ltr" required="{{ yes }}" hint="المتاح في العليا 128"></x-import>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="من" options="{{ locs }}" default-value="olaya" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="إلى" options="{{ locs2 }}" default-value="malqa" required="{{ yes }}"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.RadioGroup" label="النقل" options="{{ modes }}" default-value="transit"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">الأثر</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>تخرج الكمية من العليا الآن، وتظهر «قيد النقل» ولا تتاح في الملقا حتى يؤكد الوصول.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>النقل الفوري يُستخدم حين تكون الكمية في الموقع نفسه فعلًا.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="StockList.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="StockList.dc.html">تسجيل الخروج</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, h24: 24, s16: 16, s24: 24, prods: [ { value: 'blk', label: 'مقبض مخفي 60 سم، أسود مطفي' } ], locs: [ { value: 'olaya', label: 'مستودع العليا' } ], locs2: [ { value: 'malqa', label: 'معرض الملقا' } ], modes: [ { value: 'transit', label: 'يحتاج نقلًا فعليًا، يُؤكد وصوله لاحقًا' }, { value: 'now', label: 'نقل فوري' } ] };
  }
}
</script>
</body>
</html>
