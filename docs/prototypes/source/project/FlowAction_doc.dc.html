<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>إعداد إعداد عرض سعر أو عقد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1250px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="FlowEdit" hint-size="1440px,1250px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog o1-dialog--lg" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">إعداد «إعداد عرض سعر أو عقد» في «التصميم والعرض»</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">إجراء نظام من مجموعة «الاتفاق والاعتماد». الحفظ في مسودة المسار، والنشر بعد الفحص.</p>
    <div style="display: flex; flex-direction: column; gap: 16px;"><x-import component-from-global-scope="OpsOne.TextField" label="الاسم في المرحلة" default-value="إعداد عرض السعر" required="{{ yes }}" hint="يظهر في الطلب والمهام؛ معنى الإجراء لا يتغير"></x-import><x-import component-from-global-scope="OpsOne.RadioGroup" label="الانطباق" options="{{ applyOpts }}" default-value="req" hint="المطلوب يمنع إكمال المرحلة؛ الاختياري لا يمنعه ويبقى تحت متابعة"></x-import><x-import component-from-global-scope="OpsOne.SelectField" label="الإسناد" options="{{ assign }}" default-value="owner" hint="الدور يحدد المؤهلين؛ لا يُسند لكل أصحاب الدور"></x-import><x-import component-from-global-scope="OpsOne.RadioGroup" label="المستند" options="{{ docs }}" default-value="quote"></x-import></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">عند الحفظ والنشر</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>الخصم فوق حد المعد يطلب قرارًا قبل الإرسال.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>إعداد المستند لا يعني موافقة العميل.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="FlowAddAction.dc.html">رجوع إلى القائمة</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="FlowEdit.dc.html">حفظ في المسودة</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1250}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, s16: 16, noop, applyOpts: [ { value: 'req', label: 'مطلوب' }, { value: 'opt', label: 'اختياري' }, { value: 'need', label: 'عند الحاجة' } ], needs: [ { value: 'm', label: 'الطلب يحتاج قياسًا' }, { value: 'd', label: 'الطلب يحتاج تصميمًا' } ], assign: [ { value: 'owner', label: 'مسؤول الطلب' }, { value: 'mdesign', label: 'صندوق قسم القياس والتصميم' }, { value: 'make', label: 'صندوق قسم التصنيع والتركيب' }, { value: 'sales', label: 'صندوق قسم المبيعات' }, { value: 'fin', label: 'المالية (تأكيد التحصيل)' }, { value: 'stock', label: 'المخزون والتوريد' } ], purpose: [ { value: 'first', label: 'قياس أولي' }, { value: 'final', label: 'قياس نهائي' } ], docs: [ { value: 'quote', label: 'عرض سعر' }, { value: 'contract', label: 'عقد' } ], targets: [ { value: 'quote', label: 'عرض السعر (من «إعداد عرض السعر»)' }, { value: 'design', label: 'التصميم (من «إعداد التصميم»)' }, { value: 'contract', label: 'العقد' } ], supplyRes: [ { value: 'sent', label: 'طلب التوريد مرسل للمورد' }, { value: 'recv', label: 'المواد مستلمة بالكامل' } ], pays: [ { value: 'first', label: 'الدفعة الأولى' }, { value: 'mid', label: 'دفعة بدء التصنيع' }, { value: 'last', label: 'الدفعة الأخيرة' } ], payAmt: [ { value: 'full', label: 'كامل الدفعة' }, { value: 'part', label: 'نسبة منها' } ] };
  }
}
</script>
</body>
</html>
