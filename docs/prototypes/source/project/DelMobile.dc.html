<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تسجيل التسليم على الجوال</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="width: 390px; min-height: 1300px; display: flex; flex-direction: column; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <header style="display: flex; align-items: center; gap: 4px; min-height: 64px; padding-inline: 8px 8px; background: var(--surface); border-bottom: 1px solid var(--stroke-weak);">
    <x-import component-from-global-scope="OpsOne.Button" variant="ghost" icon="arrow-left" icon-only="{{ yes }}" aria-label="رجوع إلى المهمة" href="TaskMobile.dc.html"></x-import>
    <span style="font-weight: 600;">التسليم</span>
    <div style="margin-inline-start: auto; display: flex;"></div>
  </header>
  <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; flex-direction: column; gap: 4px;"><h1 style="margin: 0; font-size: 22px; line-height: 34px; font-weight: 700;">تسجيل تسليم <bdi dir="ltr" style="font-family: var(--font-mono);">ORD-24476</bdi></h1><span style="color: var(--text-weak);">بالكميات المستلمة فعلًا.</span></div>
    <section aria-label="الكميات" style="display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--stroke-weak); border-radius: 12px;">
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: end; padding: 10px 16px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">خزانة ملابس بأبواب منزلقة</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">غير المسلّم 1</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلّم" default-value="1" dir="ltr" input-mode="numeric"></x-import></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: end; padding: 10px 16px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">وحدة تلفاز معلقة</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">غير المسلّم 1</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلّم" default-value="1" dir="ltr" input-mode="numeric"></x-import></div>
      <div style="display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 12px; align-items: end; padding: 10px 16px; border-top: 1px solid var(--stroke-weak);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 500;">رف مكتب</span><span style="font-size: 13px; line-height: 20px; color: var(--text-weak);">غير المسلّم 2</span></span><x-import component-from-global-scope="OpsOne.TextField" label="المسلّم" default-value="1" dir="ltr" input-mode="numeric"></x-import></div>
    </section>
    <x-import component-from-global-scope="OpsOne.TextField" label="المستلم" default-value="لطيفة الحربي" required="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}" hint="توقيع العميلة على الشاشة أو صورة المحضر."></x-import>
    <x-import component-from-global-scope="OpsOne.TextField" label="ملاحظة إصلاح" default-value="الرف الثاني تالف من النقل؛ يُعاد تصنيعه." multiline="{{ yes }}"></x-import>
    <x-import component-from-global-scope="OpsOne.Checkbox" label="تمنع إكمال التسليم" default-checked="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">عند التثبيت</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يبقى رف واحد غير مسلّم.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>تُنشأ مهمة إصلاح في صندوق القسم.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>لا يُسجل تحصيل.</span></span>
    </div>
    <x-import component-from-global-scope="OpsOne.Button" variant="primary" href="ExecHomeMobile.dc.html" block="{{ yes }}">تثبيت التسليم</x-import>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1300}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, h24: 24, s16: 16, noop, proof: [ { id: 'p1', name: 'توقيع-لطيفة.png', size: 84120, status: 'done' } ] };
  }
}
</script>
</body>
</html>
