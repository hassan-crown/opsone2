<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>صرف عمولة</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1000px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="FinCommissions" hint-size="1440px,1000px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">صرف عمولة نورة الدوسري؟</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--stroke-weak); border: 1px solid var(--stroke-weak); border-radius: 8px; overflow: hidden;"><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">المستحق</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="4,820.40"></x-import></span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">المصروف سابقًا</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="3,100.00"></x-import></span></div><div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--raised);"><span style="font-size: 14px; line-height: 20px; font-weight: 500; color: var(--text-weak);">المتاح</span><span style="font-weight: 600;"><x-import component-from-global-scope="OpsOne.Amount" value="1,720.40"></x-import></span></div></div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.TextField" label="المبلغ" default-value="1,720.40" dir="ltr" required="{{ yes }}" hint="حتى 1,720.40"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="الفترة" default-value="أكتوبر 2026" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.SelectField" label="الطريقة" options="{{ pmethods }}" default-value="transfer" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="المرجع" default-value="SAL-2610-07" dir="ltr" optional="{{ yes }}"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">عند الحفظ</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يُعاد فحص المتاح؛ رد أو نزاع وقع للتو يُحجز أولًا.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--info-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="info" size="{{ s16 }}"></x-import></span><span>رد أو إلغاء لاحق يضيف فرقًا سالبًا يُرحّل، ولا يمحو هذا الصرف.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="FinCommissions.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="FinCommissions.dc.html">تسجيل الصرف</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1000}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24, noop, pmethods: [ { value: 'transfer', label: 'تحويل بنكي' }, { value: 'payroll', label: 'مع الراتب' }, { value: 'cash', label: 'نقدًا' } ], proof: [ { id: 'p1', name: 'تحويل-عمولة-نورة.pdf', size: 120400, status: 'done' } ] };
  }
}
</script>
</body>
</html>
