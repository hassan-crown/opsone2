<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>توثيق موافقة خارجية</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/opsone/tokens.css">
<link rel="stylesheet" href="ds/opsone/components/bundle.css">
<script src="ds/opsone/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div dir="rtl" data-surface="panel" style="position: relative; width: 1440px; height: 1100px; overflow: hidden; background: var(--background); color: var(--text-strong); font-family: var(--font-sans); font-size: 14px; line-height: 24px;">
  <div aria-hidden="true" inert="" style="position: absolute; inset: 0;">
    <dc-import name="AgrDocument" hint-size="1440px,1200px"></dc-import>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--overlay);"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="d-t" aria-describedby="d-d" class="o1-dialog" style="position: absolute; inset: 0; margin: auto; height: fit-content;">
    <div class="o1-dialog-inner">
    <div class="o1-dialog-head">
      <h2 id="d-t" class="o1-dialog-title">توثيق موافقة خارجية على <bdi dir="ltr" style="font-family: var(--font-mono);">QUO-3311</bdi>؟</h2>
      <button type="button" class="o1-dialog-close" aria-label="إغلاق"><x-import component-from-global-scope="OpsOne.Icon" name="x"></x-import></button>
    </div>
    <p id="d-d" class="o1-dialog-desc">92,598.00 ر.س، بالمحتوى المرسل أمس 15:05.</p>
    
    <x-import component-from-global-scope="OpsOne.RadioGroup" label="طريقة الموافقة" options="{{ methods }}" default-value="whatsapp" inline="{{ yes }}" required="{{ yes }}"></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px;">
      <x-import component-from-global-scope="OpsOne.SelectField" label="من وافق" options="{{ contacts }}" default-value="adel" required="{{ yes }}"></x-import>
      <x-import component-from-global-scope="OpsOne.TextField" label="تاريخ الموافقة" default-value="23/10/2026" dir="ltr" required="{{ yes }}"></x-import>
    </div>
    <x-import component-from-global-scope="OpsOne.FileUpload" label="الإثبات" files="{{ proof }}" on-select="{{ noop }}" on-remove="{{ noop }}" required="{{ yes }}" hint="صورة الرسالة أو الورقة الموقعة. PDF أو JPG أو PNG، حتى 10 ميجابايت."></x-import>
    <x-import component-from-global-scope="OpsOne.TextField" label="ملاحظة" multiline="{{ yes }}" optional="{{ yes }}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: var(--fill); border-radius: 8px;">
      <span style="font-weight: 600;">بعد التوثيق</span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>تتحقق موافقة العميل على هذا المحتوى دون دخوله، وتُحفظ الطريقة والإثبات.</span></span>
      <span style="display: flex; gap: 8px;"><span style="color: var(--success-text); display: inline-flex;"><x-import component-from-global-scope="OpsOne.Icon" name="check" size="{{ s16 }}"></x-import></span><span>يُثبَّت اتفاق الطلب نفسه مرة واحدة، ولا تُطلب مراجعة ثانية.</span></span>
    </div>
    <div class="o1-dialog-foot">
      <x-import component-from-global-scope="OpsOne.Button" variant="ghost" href="AgrDocument.dc.html">إلغاء</x-import><x-import component-from-global-scope="OpsOne.Button" variant="primary" href="AgrDocument.dc.html">توثيق الموافقة</x-import>
    </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1100}}'>
class Component extends DCLogic {
  renderVals() {
    const noop = () => {};
    return { yes: true, no: false, h28: 28, s16: 16, s24: 24, noop, methods: [ { value: 'whatsapp', label: 'رسالة واتساب' }, { value: 'email', label: 'بريد إلكتروني' }, { value: 'paper', label: 'ورقة موقعة' } ], proof: [ { id: 'p1', name: 'موافقة-عادل-واتساب.png', size: 284312, status: 'done' } ], contacts: [ { value: 'adel', label: 'م. عادل الشهري، المشتريات' }, { value: 'salman', label: 'سلمان القرني، المالية' }, { value: 'fahad', label: 'م. فهد البيشي، مهندس الموقع' } ] };
  }
}
</script>
</body>
</html>
