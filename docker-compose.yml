# -----------------------------------------------------------------------------
# Shared Docker Compose configuration
# -----------------------------------------------------------------------------
# This file contains the common services used by all environments.
# Production-specific settings such as Traefik labels should be placed
# in docker-compose.prod.yml.
# -----------------------------------------------------------------------------

services:
  app:
    image: ${APP_NAME}_${ENVIRONMENT}_php:latest
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        WITH_XDEBUG: ${WITH_XDEBUG:-false}
        INSTALL_NODE: ${INSTALL_NODE:-false}
        NODE_MAJOR: ${NODE_MAJOR:-24}
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    container_name: ${APP_NAME}_${ENVIRONMENT}_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    environment:
      WWWUSER: "${WWWUSER:-1000}"
      WWWGROUP: "${WWWGROUP:-1000}"
      HOME: /var/www/html
      COMPOSER_HOME: /tmp/composer
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-5}
    mem_limit: ${APP_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"

  web:
    image: nginx:stable-alpine
    container_name: ${APP_NAME}_${ENVIRONMENT}_web
    restart: unless-stopped
    volumes:
      - ./src/public:/var/www/html/public:ro
      - ./src/storage/app/public:/var/www/html/storage/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"

  mariadb:
    image: mariadb:11
    container_name: ${APP_NAME}_${ENVIRONMENT}_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${APP_NAME}_${ENVIRONMENT}_db
      MYSQL_USER: ${APP_NAME}_${ENVIRONMENT}_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    command:
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # mysql:
  #   image: mysql:8.0
  #   container_name: ${APP_NAME}_${ENVIRONMENT}_db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
  #     MYSQL_ROOT_HOST: "%"
  #     MYSQL_DATABASE: ${APP_NAME}_${ENVIRONMENT}_db
  #     MYSQL_USER: ${APP_NAME}_${ENVIRONMENT}_user
  #     MYSQL_PASSWORD: ${DB_PASSWORD}
  #     MYSQL_ALLOW_EMPTY_PASSWORD: "no"
  #   volumes:
  #     - db-data:/var/lib/mysql
  #   networks:
  #     - internal
  #   ports:
  #     - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
  #   healthcheck:
  #     test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 20s
  #   # skip-log-bin: no binlog (no point-in-time recovery / replication needed).
  #   # flush-log-at-trx-commit=2: fsync redo log once per second (may lose ~1s on host crash).
  #   # Memory knobs come from the root .env so each environment/tenant can tune them.
  #   command:
  #     - --skip-log-bin
  #     - --innodb-flush-log-at-trx-commit=2
  #     - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL_SIZE:-256M}
  #     - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
  #     - --performance-schema=${MYSQL_PERFORMANCE_SCHEMA:-OFF}

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME}_${ENVIRONMENT}_redis
    restart: unless-stopped
    # AOF keeps queued jobs across restarts (loses at most ~1s on host crash).
    # volatile-lru: when full, evict only keys with a TTL (cache/sessions), never queue keys.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory ${REDIS_MAX_MEMORY:-256mb} --maxmemory-policy volatile-lru
    volumes:
      - redis:/data
    networks:
      - internal
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  installer:
    image: ${APP_NAME}_${ENVIRONMENT}_php:latest
    container_name: ${APP_NAME}_${ENVIRONMENT}_installer
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./scripts/installer.sh:/usr/local/bin/installer.sh:ro
      - ./src/.composer:/tmp/composer
    networks:
      - internal
    profiles: ["tooling"]
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      WWWUSER: "${WWWUSER:-1000}"
      WWWGROUP: "${WWWGROUP:-1000}"
      COMPOSER_HOME: /var/www/html/.composer
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: ["bash", "/usr/local/bin/installer.sh"]

  node-build:
    image: ${APP_NAME}_${ENVIRONMENT}_node:latest
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_MAJOR: ${NODE_MAJOR:-24}
    container_name: ${APP_NAME}_${ENVIRONMENT}_node_build
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - internal
    profiles: ["tooling"]
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/.corepack
      # No PHP in this image; manage.sh runs wayfinder:generate in the app container.
      WAYFINDER_COMMAND: "true"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    command: ["sh", "-lc", "pnpm install --store-dir /var/www/html/.pnpm-store && pnpm run build"]

  node-dev:
    image: ${APP_NAME}_${ENVIRONMENT}_node:latest
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        NODE_MAJOR: ${NODE_MAJOR:-24}
    container_name: ${APP_NAME}_${ENVIRONMENT}_node_dev
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - internal
    profiles: ["frontend"]
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/.corepack
      # No PHP in this image; manage.sh runs wayfinder:generate in the app container.
      WAYFINDER_COMMAND: "true"
      # laravel-vite-plugin container mode: listen on 0.0.0.0, publish http://localhost:VITE_PORT in public/hot.
      LARAVEL_SAIL: "1"
      VITE_PORT: "${VITE_PORT:-5173}"
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    ports:
      # Same port inside and outside so the Vite HMR URL matches the host port.
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    command: ["sh", "-lc", "pnpm install --store-dir /var/www/html/.pnpm-store && pnpm run dev"]

  scheduler:
    image: ${APP_NAME}_${ENVIRONMENT}_php:latest
    container_name: ${APP_NAME}_${ENVIRONMENT}_scheduler
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    profiles: ["jobs"]
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    stop_grace_period: 30s
    command: >
      sh -lc "php artisan schedule:work --no-interaction"

  worker:
    image: ${APP_NAME}_${ENVIRONMENT}_php:latest
    container_name: ${APP_NAME}_${ENVIRONMENT}_worker
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    profiles: ["jobs"]
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    environment:
      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-512M}
    mem_limit: ${WORKER_MEM_LIMIT:-512m}
    stop_grace_period: 60s
    command: >
      sh -lc "php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=120 --memory=256 --max-time=3600 --no-interaction"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: ${APP_NAME}_${ENVIRONMENT}_pma
    restart: unless-stopped
    profiles: ["tooling"]
    environment:
      PMA_HOST: mariadb
      UPLOAD_LIMIT: 256M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"

networks:
  internal:

volumes:
  db-data:
  redis: