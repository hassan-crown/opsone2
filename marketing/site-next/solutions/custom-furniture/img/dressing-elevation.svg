<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1050" width="1400" height="1050">
  <!-- OpsOne custom-furniture hero: front elevation of a made-to-measure dressing room. Own artwork, no text, no people. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE7DD"/><stop offset="1" stop-color="#E4DACC"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9B79F"/><stop offset="1" stop-color="#B49E83"/></linearGradient>
    <linearGradient id="carcass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBFAF7"/><stop offset="1" stop-color="#F1EEE8"/></linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6E0D6"/><stop offset="1" stop-color="#D9D1C4"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4DA" stop-opacity=".95"/><stop offset="1" stop-color="#FFF4DA" stop-opacity="0"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8C6A4E" stop-opacity=".62"/><stop offset=".5" stop-color="#6E513B" stop-opacity=".52"/><stop offset="1" stop-color="#8C6A4E" stop-opacity=".66"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".22"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <pattern id="walnut" width="220" height="40" patternUnits="userSpaceOnUse">
      <rect width="220" height="40" fill="#6B4630"/>
      <path d="M0 8 C60 4 120 14 220 9 M0 19 C70 23 140 15 220 20 M0 31 C50 27 150 36 220 30" stroke="#57382A" stroke-width="2" fill="none" opacity=".75"/>
      <path d="M0 14 C80 12 150 18 220 14 M0 25 C60 28 160 22 220 26" stroke="#7E5640" stroke-width="1.4" fill="none" opacity=".7"/>
    </pattern>
    <pattern id="oak" width="40" height="300" patternUnits="userSpaceOnUse">
      <rect width="40" height="300" fill="#C8A273"/>
      <path d="M6 0 C9 80 3 160 7 300 M19 0 C16 90 23 200 18 300 M31 0 C35 70 28 190 33 300" stroke="#B48B5C" stroke-width="2" fill="none"/>
      <path d="M13 0 C12 100 15 200 12 300 M26 0 C28 120 24 220 27 300" stroke="#D6B488" stroke-width="1.2" fill="none"/>
    </pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3B2A1C" flood-opacity=".18"/></filter>
  </defs>

  <!-- room -->
  <rect width="1400" height="1050" fill="url(#wall)"/>
  <rect y="910" width="1400" height="140" fill="url(#floor)"/>
  <path d="M0 910 H1400" stroke="#A88F72" stroke-width="3"/>
  <g stroke="#BBA68B" stroke-width="2" opacity=".5"><path d="M0 960 H1400 M0 1012 H1400"/></g>

  <!-- the built-in wall: three bays -->
  <g filter="url(#soft)">
    <rect x="96" y="96" width="1208" height="814" rx="6" fill="url(#carcass)" stroke="#DCD5CA" stroke-width="3"/>
  </g>
  <rect x="96" y="96" width="1208" height="44" fill="#F6F3EE" stroke="#DCD5CA" stroke-width="3"/>

  <!-- bay 1 (start in RTL = right side): open hanging with white thobes -->
  <rect x="926" y="150" width="364" height="744" fill="url(#inside)"/>
  <rect x="926" y="150" width="364" height="60" fill="url(#glow)"/>
  <rect x="936" y="152" width="344" height="5" rx="2.5" fill="#FFE7B0"/>
  <path d="M942 236 H1274" stroke="#8D7B66" stroke-width="7" stroke-linecap="round"/>
  <g fill="#FCFBF8" stroke="#D8D1C6" stroke-width="2">
    <path d="M960 240 h44 l14 34 v438 h-72 v-438z"/>
    <path d="M1030 240 h44 l14 34 v438 h-72 v-438z"/>
    <path d="M1100 240 h44 l14 34 v438 h-72 v-438z"/>
    <path d="M1170 240 h44 l14 34 v438 h-72 v-438z"/>
  </g>
  <g stroke="#E8E2D8" stroke-width="2" fill="none"><path d="M982 274 v420 M1052 274 v420 M1122 274 v420 M1192 274 v420"/></g>
  <g fill="#8D7B66"><circle cx="982" cy="238" r="5"/><circle cx="1052" cy="238" r="5"/><circle cx="1122" cy="238" r="5"/><circle cx="1192" cy="238" r="5"/></g>
  <!-- folded ghutras on the top shelf -->
  <rect x="926" y="208" width="364" height="8" fill="#EAE4DA"/>
  <g><rect x="948" y="186" width="70" height="20" rx="3" fill="#F7F3EC" stroke="#DCD3C6" stroke-width="2"/><rect x="1030" y="186" width="70" height="20" rx="3" fill="#C4363D"/><path d="M1030 190 h70 M1030 196 h70 M1030 202 h70" stroke="#F3E7E3" stroke-width="1.5" opacity=".8"/><rect x="1112" y="186" width="70" height="20" rx="3" fill="#F7F3EC" stroke="#DCD3C6" stroke-width="2"/></g>
  <!-- shoe shelves under the thobes -->
  <rect x="926" y="764" width="364" height="10" fill="#EAE4DA"/>
  <rect x="926" y="828" width="364" height="10" fill="#EAE4DA"/>
  <g fill="#4C3A2C"><rect x="948" y="740" width="48" height="22" rx="10"/><rect x="1006" y="740" width="48" height="22" rx="10"/><rect x="1090" y="740" width="48" height="22" rx="10" fill="#9B7A57"/><rect x="1148" y="740" width="48" height="22" rx="10" fill="#9B7A57"/><rect x="1220" y="740" width="48" height="22" rx="10"/></g>
  <g fill="#7A5B40"><rect x="960" y="804" width="48" height="22" rx="10"/><rect x="1060" y="804" width="48" height="22" rx="10"/><rect x="1160" y="804" width="48" height="22" rx="10"/></g>

  <!-- bay 2 (middle): drawers island with a walnut top, mirror panel above -->
  <rect x="560" y="150" width="356" height="744" fill="#F3F0EA"/>
  <rect x="604" y="196" width="268" height="396" rx="4" fill="#DDE3E6" stroke="#C9CFD2" stroke-width="3"/>
  <rect x="604" y="196" width="268" height="396" rx="4" fill="url(#sheen)"/>
  <path d="M640 230 L700 560 M690 230 L750 560" stroke="#fff" stroke-width="6" opacity=".35"/>
  <rect x="580" y="626" width="316" height="22" rx="3" fill="url(#walnut)"/>
  <g fill="url(#carcass)" stroke="#D9D2C7" stroke-width="3">
    <rect x="590" y="648" width="296" height="80"/>
    <rect x="590" y="728" width="296" height="80"/>
    <rect x="590" y="808" width="296" height="86"/>
  </g>
  <g stroke="#8D7B66" stroke-width="6" stroke-linecap="round"><path d="M700 688 h76 M700 768 h76 M700 851 h76"/></g>

  <!-- bay 3 (end): shelves behind a bronze-glass sliding door -->
  <rect x="110" y="150" width="440" height="744" fill="url(#inside)"/>
  <rect x="110" y="150" width="440" height="60" fill="url(#glow)"/>
  <rect x="120" y="152" width="420" height="5" rx="2.5" fill="#FFE7B0"/>
  <g fill="#EAE4DA"><rect x="110" y="300" width="440" height="10"/><rect x="110" y="450" width="440" height="10"/><rect x="110" y="600" width="440" height="10"/><rect x="110" y="750" width="440" height="10"/></g>
  <g>
    <rect x="132" y="232" width="96" height="66" rx="4" fill="#BFA98C"/><rect x="238" y="250" width="70" height="48" rx="4" fill="#E1D6C6"/><rect x="318" y="226" width="90" height="72" rx="4" fill="#9C7F61"/>
    <rect x="132" y="392" width="150" height="56" rx="4" fill="#E9E1D3"/><rect x="292" y="380" width="64" height="68" rx="4" fill="#6E5642"/><rect x="420" y="402" width="110" height="46" rx="4" fill="#CDB89C"/>
    <rect x="150" y="548" width="72" height="50" rx="4" fill="#A3242B" opacity=".85"/><rect x="232" y="536" width="120" height="62" rx="4" fill="#E9E1D3"/><rect x="420" y="530" width="104" height="68" rx="4" fill="#BFA98C"/>
    <rect x="136" y="694" width="120" height="54" rx="4" fill="#CDB89C"/><rect x="380" y="684" width="150" height="64" rx="4" fill="#E1D6C6"/>
  </g>
  <!-- sliding door, half open, across the inner part of the bay -->
  <path d="M110 166 H550" stroke="#9C8A74" stroke-width="5"/>
  <g>
    <rect x="300" y="168" width="250" height="724" fill="url(#glass)" stroke="#5B4332" stroke-width="8"/>
    <rect x="300" y="168" width="250" height="724" fill="url(#sheen)"/>
    <path d="M316 520 v120" stroke="#3E2E22" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- an oak door in the side wall, beyond the dressing room -->
  <rect x="1316" y="248" width="84" height="662" fill="url(#oak)" stroke="#9F7D55" stroke-width="3"/>
  <path d="M1316 248 V910" stroke="#7E6142" stroke-width="5"/>

  <!-- dimension lines, in the drawing's own teal (no numbers) -->
  <g stroke="#0E7C72" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M96 52 H1304"/><path d="M96 38 V66 M1304 38 V66"/>
    <path d="M110 52 l14 -8 M110 52 l14 8 M1290 52 l-14 -8 M1290 52 l-14 8"/>
    <path d="M44 96 V910"/><path d="M30 96 H58 M30 910 H58"/>
    <path d="M44 110 l-8 14 M44 110 l8 14 M44 896 l-8 -14 M44 896 l8 -14"/>
  </g>
  <g fill="#0E7C72"><circle cx="560" cy="52" r="6"/><circle cx="916" cy="52" r="6"/></g>
</svg>
