<body><div class="og"><div class="t"><img src="../../assets/brand/opsone-logo.svg" alt=""><h1>كل نظام ذكي تركّبه،<br><span>من المعاينة إلى التسليم</span></h1><p>برنامج إدارة شركات المنازل الذكية والإنارة والكاميرات</p></div><div class="ph"></div></div></body></html>
