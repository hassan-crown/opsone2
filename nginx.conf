# -----------------------------------------------------------------------------
# Nginx configuration for Laravel behind Traefik
# -----------------------------------------------------------------------------
# Traefik handles public HTTP/HTTPS traffic and forwards requests to this Nginx
# container over the internal Docker network.
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Laravel must be served only from the public directory.
    root /var/www/html/public;
    index index.php index.html;

    # Must be aligned with PHP post_max_size.
    client_max_body_size 120M;

    # Basic security headers.
    # CSP and HSTS are intentionally not added here to avoid breaking apps
    # or duplicating Traefik-level policies.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Do not log common static asset requests.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Internal container readiness endpoint (HTTP 200 independent of Laravel DB).
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Main Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire assets and update endpoints must be handled by Laravel.
    # Do not treat /livewire/livewire.js or /livewire-xxxx/livewire.js as static files.
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets.
    # Keep this conservative because this file is shared across projects.
    location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|webp|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Block PHP execution inside public storage.
    location ~* ^/storage/.*\.php$ {
        return 404;
    }

    # Only allow Laravel's public/index.php to be executed.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        fastcgi_hide_header X-Powered-By;

        # Reasonable FastCGI timeouts for Laravel requests.
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    # Deny direct access to any other PHP file.
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files such as .env, .git, .htaccess.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Deny access to common project/config files if root is changed by mistake.
    location ~* /(composer\.(json|lock)|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|vite\.config\..*|webpack\.mix\.js|artisan)$ {
        deny all;
    }
}