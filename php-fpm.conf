; -----------------------------------------------------------------------------
; PHP-FPM pool tuning (override via container env; defaults after :-)
; -----------------------------------------------------------------------------
; ondemand: no idle workers, so an idle tenant costs almost no memory.
; Worst-case memory ~= PHP_FPM_MAX_CHILDREN x (real usage per request, capped by PHP_MEMORY_LIMIT).
[www]
pm = ondemand
pm.max_children = ${PHP_FPM_MAX_CHILDREN:-5}
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Used by the container readiness check; not routed through Nginx publicly.
ping.path = /fpm-ping
ping.response = pong
