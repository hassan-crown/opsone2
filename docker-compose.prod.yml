# -----------------------------------------------------------------------------
# Production overrides
# -----------------------------------------------------------------------------
# This file adds Traefik routing and removes direct host port exposure
# where needed.
# Usage:
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# -----------------------------------------------------------------------------

services:
  mariadb:
    ports: !reset []

  redis:
    ports: !reset []

  web:
    ports: !reset []
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"

      # HTTP router
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-http.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-http.entrypoints=web"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-http.middlewares=${APP_NAME}-${ENVIRONMENT}-https-redirect"

      # HTTPS redirect middleware
      - "traefik.http.middlewares.${APP_NAME}-${ENVIRONMENT}-https-redirect.redirectscheme.scheme=https"

      # HTTPS router
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-https.rule=Host(`${WEB_DOMAIN}`)"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-https.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-https.tls=true"
      - "traefik.http.routers.${APP_NAME}-${ENVIRONMENT}-https.tls.certresolver=letsencrypt"

      # Service
      - "traefik.http.services.${APP_NAME}-${ENVIRONMENT}-https.loadbalancer.server.port=80"

  # phpMyAdmin has no public route here (audit M-6): it stays on the internal network and on 127.0.0.1 of the
  # server (docker-compose.yml), reached through an SSH tunnel. dev/stage may add docker-compose.pma.yml, which
  # publishes it through Traefik behind an IP allowlist and Basic Auth; ./manage.sh pma never loads it in prod.

networks:
  proxy:
    external: true